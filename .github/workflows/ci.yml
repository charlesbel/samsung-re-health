name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[mcp,dev]
      - name: Code formatting & lint
        run: |
          ruff format --check .
          ruff check .
      - name: Run test suite
        run: |
          pytest
      - name: Build and inspect package
        run: |
          python -m build
          twine check dist/*
          python -c "
          import tarfile, zipfile, glob, sys
          for sdist in glob.glob('dist/*.tar.gz'):
              with tarfile.open(sdist, 'r:gz') as tf:
                  names = tf.getnames()
                  for name in names:
                      if '.agy' in name or 'private' in name or '.sqlite3' in name:
                          print(f'Forbidden file in sdist: {name}', file=sys.stderr)
                          sys.exit(1)
          for wheel in glob.glob('dist/*.whl'):
              with zipfile.ZipFile(wheel, 'r') as zf:
                  names = zf.namelist()
                  for name in names:
                      if '.agy' in name or 'private' in name or '.sqlite3' in name:
                          print(f'Forbidden file in wheel: {name}', file=sys.stderr)
                          sys.exit(1)
          print('Artifact verification passed: all builds are clean.')
          "
