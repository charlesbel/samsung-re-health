name: Release Verification & Publishing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish verified distribution packages to PyPI"
        type: boolean
        default: false

jobs:
  verify-release:
    name: Verify Release Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install build tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[mcp,dev] pip-audit

      - name: Validate tag matches pyproject.toml version
        run: |
          if [ "${{ inputs.publish_to_pypi }}" = "true" ] && [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "ERROR: Manual publish_to_pypi requested on non-tag ref '${{ github.ref }}'. PyPI publish is only permitted on refs/tags/v*." >&2
            exit 1
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
            if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
              echo "ERROR: Git tag version '${TAG_VERSION}' does not match pyproject.toml version '${PYPROJECT_VERSION}'" >&2
              exit 1
            fi
            echo "Tag version '${TAG_VERSION}' successfully verified against pyproject.toml version '${PYPROJECT_VERSION}'."
          fi

      - name: Code formatting & lint
        run: |
          ruff format --check .
          ruff check .

      - name: Run full test suite (normal and optimized)
        run: |
          pytest -q
          python -O -m pytest -q

      - name: Build distribution packages
        run: |
          python -m build
          twine check --strict dist/*

      - name: Run installed-wheel official MCP stdio smoke
        run: |
          python scripts/smoke_wheel_mcp.py

      - name: Run privacy and archive inspection
        run: |
          python scripts/verify_privacy.py

      - name: Run dependency vulnerability audit (pip-audit)
        run: |
          pip-audit --strict

      - name: Run full-history secret scan (Gitleaks with redaction)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          "$(go env GOPATH)/bin/gitleaks" git --config .gitleaks.toml --verbose --redact

      - name: Upload distribution packages
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist-packages
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: [verify-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish_to_pypi == true)
    environment:
      name: pypi
      url: https://pypi.org/p/samsung-re-health
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist-packages
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release (Final)
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download distribution packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist-packages
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
