name: Release Verification

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318edeed2796c01c3abba81adc8 # v5.3.0
        with:
          python-version: "3.12"
      - name: Install build tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[mcp,dev]
      - name: Code formatting & lint
        run: |
          ruff format --check .
          ruff check .
      - name: Run full test suite
        run: |
          pytest -q
      - name: Build distribution packages
        run: |
          python -m build
          twine check --strict dist/*
      - name: Run privacy and archive inspection
        run: |
          python scripts/verify_privacy.py
