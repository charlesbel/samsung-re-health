name: Release Verification & Publishing

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable release tag to build"
        required: true
        type: string
      publish_to_pypi:
        description: "Publish verified distribution packages to PyPI"
        type: boolean
        default: false

jobs:
  verify-release:
    name: Verify Release Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install build tools and dependencies
        run: |
          python -m pip install --upgrade pip uv
          pip install .[mcp,dev] pip-audit

      - name: Validate tag matches pyproject.toml version
        run: |
          RELEASE_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Release tag '$RELEASE_TAG' is not an exact numeric SemVer tag." >&2
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "ERROR: Release tag '$RELEASE_TAG' does not point to the checked-out commit." >&2
            exit 1
          fi
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$RELEASE_TAG" != "$PYPROJECT_VERSION" ]; then
            echo "ERROR: Git tag version '${RELEASE_TAG}' does not match pyproject.toml version '${PYPROJECT_VERSION}'" >&2
            exit 1
          fi
          echo "Tag version '${RELEASE_TAG}' successfully verified against pyproject.toml version '${PYPROJECT_VERSION}'."

      - name: Code formatting & lint
        run: |
          ruff format --check .
          ruff check .

      - name: Run full test suite (normal and optimized)
        run: |
          pytest -q
          python -O -m pytest -q

      - name: Build distribution packages
        run: |
          python -m build
          twine check --strict dist/*

      - name: Run installed-wheel official MCP stdio smoke
        run: |
          python scripts/smoke_wheel_mcp.py

      - name: Run privacy and archive inspection
        run: |
          python scripts/verify_privacy.py

      - name: Run dependency vulnerability audit (pip-audit)
        run: |
          uv export --frozen --no-dev --extra mcp --no-emit-project --output-file /tmp/audit-requirements.txt
          pip-audit --strict --requirement /tmp/audit-requirements.txt

      - name: Run full-history secret scan (Gitleaks with redaction)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          "$(go env GOPATH)/bin/gitleaks" git --config .gitleaks.toml --verbose --redact

      - name: Upload distribution packages
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist-packages
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: [verify-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish_to_pypi == true
    environment:
      name: pypi
      url: https://pypi.org/p/samsung-re-health
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist-packages
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release (Final)
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish_to_pypi == true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download distribution packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist-packages
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          gh release create "$RELEASE_TAG" dist/* \
            --title "Release $RELEASE_TAG" \
            --generate-notes
