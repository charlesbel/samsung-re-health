[project]
name = "samsung-re-health"
version = "0.7.0"
description = "Unofficial reverse-engineered Samsung Health SDK, JSON CLI & MCP server"
readme = "README.md"
authors = [{ name = "Charles Bel" }]
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27,<0.29",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
mcp = ["mcp==1.29.1"]
dev = [
    "build",
    "jsonschema>=4.20",
    "mcp==1.29.1",
    "pytest>=8.0",
    "ruff>=0.8.0",
    "twine",
]

[project.scripts]
samsung-re-health = "samsung_health_cloud.cli:main"
samsung-re-health-mcp = "samsung_health_cloud.mcp_server:main"
samsung-health = "samsung_health_cloud.cli:main"
samsung-health-cloud = "samsung_health_cloud.cli:main"
samsung-health-mcp = "samsung_health_cloud.mcp_server:main"

[project.urls]
Homepage = "https://github.com/charlesbel/samsung-re-health"
Repository = "https://github.com/charlesbel/samsung-re-health"
Issues = "https://github.com/charlesbel/samsung-re-health/issues"
Documentation = "https://github.com/charlesbel/samsung-re-health#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samsung_health_cloud"]

[tool.hatch.build.targets.wheel.force-include]
"src/samsung_health_cloud/resources/manifests.json" = "samsung_health_cloud/resources/manifests.json"
"src/samsung_health_cloud/py.typed" = "samsung_health_cloud/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "schemas",
    ".skills",
    "tests",
    "docs",
    "scripts",
    "README.md",
    "LICENSE",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    ".agy",
    ".github",
    "*.sqlite3",
    "*.jsonl",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE"]
ignore = ["E501", "UP007", "UP035"]
